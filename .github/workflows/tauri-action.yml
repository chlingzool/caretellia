name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  windows-build:
    name: Build Windows
    permissions:
      contents: write
    uses: ./.github/workflows/windows-build.yml
    secrets: inherit

  linux-build:
    name: Build Linux
    permissions:
      contents: write
    uses: ./.github/workflows/linux-build.yml
    secrets: inherit

  macos-ios-build:
    name: Build macOS and iOS
    permissions:
      contents: write
    uses: ./.github/workflows/macos-ios-build.yml
    secrets: inherit

  android-build:
    name: Build Android
    permissions:
      contents: read
    uses: ./.github/workflows/android-build.yml

  publish-mobile:
    name: Attach mobile artifacts to release
    needs:
      - windows-build
      - linux-build
      - macos-ios-build
      - android-build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: download mobile artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: caretellia-mobile-*
          path: mobile-artifacts
          merge-multiple: true

      - name: upload mobile artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag_name="app-v$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          gh release upload "$tag_name" mobile-artifacts/* --clobber
