name: macos-ios-build

on:
  workflow_call:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v5

      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: caretellia-desktop-macos-${{ matrix.target }}
          path: src-tauri/target/**/release/bundle/**/*
          if-no-files-found: error
          retention-days: 7

  ios-simulator:
    name: iOS arm64 Simulator debug app
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: install frontend dependencies
        run: npm ci

      - name: initialize iOS project
        run: npm run tauri -- ios init --ci --skip-targets-install

      - name: build iOS Simulator app
        run: npm run tauri -- ios build --debug --target aarch64-sim --no-sign

      - name: collect iOS Simulator app
        shell: bash
        run: |
          app_path="$(find src-tauri/gen/apple/build -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "iOS build completed without producing a Simulator app." >&2
            exit 1
          fi
          mkdir -p mobile-artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app_path" \
            mobile-artifacts/caretellia-mobile-ios-arm64-simulator-debug.zip

      - name: upload iOS Simulator app
        uses: actions/upload-artifact@v6
        with:
          name: caretellia-mobile-ios-arm64-simulator-debug
          path: mobile-artifacts/caretellia-mobile-ios-arm64-simulator-debug.zip
          if-no-files-found: error
          retention-days: 7
