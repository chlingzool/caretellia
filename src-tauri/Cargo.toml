[package]
name = "caretellia"
version = "1.1.2-RE1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their descriptions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# `_lib` suffix is required to make lib name unique and wouldn't conflict with the bin name.
name = "caretellia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = [
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
fontconfig = "0.9"
yeslogic-fontconfig-sys = "6"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.4"


# Read more about RUSTFLAGS optimization guidelines at https://tauri.app/learn/develop/production-apps/#rust-optimization
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
